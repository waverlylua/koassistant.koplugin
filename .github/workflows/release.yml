name: Create Release Zip

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Fork release tag (e.g., waverly-v0.23.1)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Verify fork tag and source version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, re
          tag = os.environ["RELEASE_TAG"]
          version = re.search(r'version\s*=\s*"([^"]+)"', pathlib.Path("_meta.lua").read_text()).group(1)
          assert tag == "waverly-v" + version, "Release tag must match the fork version in _meta.lua"
          assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?", version), "Invalid release version"
          assert 'REPO_OWNER = "waverlylua"' in pathlib.Path("koassistant_constants.lua").read_text(), "Wrong update channel"
          PYTHON

      - name: Create plugin directory structure
        run: |
          mkdir -p build/koassistant.koplugin
          # Copy all files except excluded ones
          rsync -av --exclude='.git' \
                    --exclude='.github' \
                    --exclude='.claude' \
                    --exclude='build' \
                    --exclude='docs' \
                    --exclude='tests' \
                    --exclude='scripts' \
                    --exclude='hooks' \
                    --exclude='screenshots' \
                    --exclude='.gitignore' \
                    . build/koassistant.koplugin/

      - name: Create zip archive
        run: |
          cd build
          zip -r koassistant.koplugin.zip koassistant.koplugin

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: build/koassistant.koplugin.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
